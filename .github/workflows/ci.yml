# Runs on every push and pull request to keep main green.
#
# Jobs:
#   lint   — deno task lint + deno task doc
#   fmt    — deno fmt --check (formatting gate; use `deno fmt` locally to fix)
#   test   — deno task test (full suite with leak tracing + GC exposure)
#   bench  — deno task bench
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.8.x

      - name: Cache Deno deps
        uses: actions/cache@v5
        with:
          path: ~/.cache/deno
          key: ${{ runner.os }}-deno-${{ hashFiles('deno.lock') }}
          restore-keys: |
            ${{ runner.os }}-deno-

      - name: Install locked dependencies
        run: deno task deps:ci

      - name: Lint
        run: deno task lint
      - name: Doc Lint
        run: deno task doc

  # fmt:
