# One-time setup before this workflow can publish to npm:
# - Link `okikio/undent` in the JSR package settings so `deno publish`
#   can exchange GitHub OIDC credentials for a short-lived publish token.
# - Add an npm automation or granular publish token as the `NPM_TOKEN`
#   repository secret for the very first npm publish, because npm only exposes
#   trusted publisher settings after the package exists.
# - After the first npm publish succeeds, configure npm trusted publishing for
#   this workflow and delete `NPM_TOKEN` if you do not want the bootstrap
#   fallback to remain available.
#
# Publish-only flow:
#   published GitHub Release or manual dispatch with an existing tag
#     -> deno task deps:ci restores the exact locked dependency graph for the tagged commit
#     -> publish the specified tag to JSR and npm
#     -> or retry only npm / only JSR after a partial publish failure
#
# The first npm publish can use NPM_TOKEN bootstrap mode. After npm trusted
# publishing is configured for this workflow, later publishes can use the
# default auto mode and ignore the token path.
name: Publish Registries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish manually, for example undent@1.2.3."
        required: true
        type: string
      target:
        description: "Registry target for publish retries."
        required: true
        type: choice
        default: both
        options:
          - both
          - jsr
          - npm
      npm_auth:
        description: "Authentication mode for npm publish-only retries."
        required: true
        type: choice
        default: auto
        options:
          - auto
          - trusted
          - token

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.tag || github.run_id }}
  cancel-in-progress: false

jobs:
  resolve-publish:
    name: Resolve publish target
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.resolve.outputs.should_publish }}
      ref: ${{ steps.resolve.outputs.ref }}
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      publish_jsr: ${{ steps.resolve.outputs.publish_jsr }}
      publish_npm: ${{ steps.resolve.outputs.publish_npm }}
      npm_auth: ${{ steps.resolve.outputs.npm_auth }}
    steps:
      - name: Select the release tag to publish
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
          DISPATCH_TARGET: ${{ inputs.target }}
          DISPATCH_NPM_AUTH: ${{ inputs.npm_auth }}
        run: |
          TAG=''
          TARGET='both'
          NPM_AUTH='auto'

          if [ "$EVENT_NAME" = 'release' ]; then
            TAG="$RELEASE_TAG"
          elif [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            TAG="$DISPATCH_TAG"
            TARGET="$DISPATCH_TARGET"
            NPM_AUTH="$DISPATCH_NPM_AUTH"
          fi

          if [ "$EVENT_NAME" = 'workflow_dispatch' ] && [ -z "$TAG" ]; then
            echo 'Manual publish dispatch requires a tag input.' >&2
            exit 1
          fi

          if [ -z "$TAG" ]; then
            echo 'should_publish=false' >> "$GITHUB_OUTPUT"
            echo 'ref=' >> "$GITHUB_OUTPUT"
            echo 'tag=' >> "$GITHUB_OUTPUT"
            echo 'version=' >> "$GITHUB_OUTPUT"
            echo 'npm_auth=' >> "$GITHUB_OUTPUT"
            echo 'publish_jsr=false' >> "$GITHUB_OUTPUT"
            echo 'publish_npm=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$TAG" in
            undent@*)
              VERSION="${TAG#undent@}"
              ;;
            *)
              echo "Expected release tag in the form undent@<version>, received: $TAG" >&2
              exit 1
              ;;
          esac

          echo 'should_publish=true' >> "$GITHUB_OUTPUT"
          echo "ref=$TAG" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "npm_auth=$NPM_AUTH" >> "$GITHUB_OUTPUT"

          if [ "$TARGET" = 'both' ] || [ "$TARGET" = 'jsr' ]; then
            echo 'publish_jsr=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish_jsr=false' >> "$GITHUB_OUTPUT"
          fi

          if [ "$TARGET" = 'both' ] || [ "$TARGET" = 'npm' ]; then
            echo 'publish_npm=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish_npm=false' >> "$GITHUB_OUTPUT"
          fi

  publish-jsr:
    name: Publish to JSR
    needs:
      - resolve-publish
    if: needs.resolve-publish.outputs.should_publish == 'true' && needs.resolve-publish.outputs.publish_jsr == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-publish.outputs.ref }}

      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.8.x

      - name: Install locked dependencies
        run: deno task deps:ci

      - name: Update deno.json with release version
        env:
          RELEASE_VERSION: ${{ needs.resolve-publish.outputs.version }}
        run: >-
          deno eval
          --allow-env=RELEASE_VERSION
          --allow-read=deno.json
          --allow-write=deno.json
          'const releaseVersion = Deno.env.get("RELEASE_VERSION");
          if (!releaseVersion) {
            throw new Error("Expected RELEASE_VERSION to be set.");
          }

          const denoJson = JSON.parse(await Deno.readTextFile("deno.json"));
          denoJson.version = releaseVersion;
          await Deno.writeTextFile(
            "deno.json",
            `${JSON.stringify(denoJson, null, 2)}\n`,
          );'

      - name: Publish to JSR
        run: deno publish

  publish-npm:
    name: Publish to npm
    needs:
      - resolve-publish
    if: needs.resolve-publish.outputs.should_publish == 'true' && needs.resolve-publish.outputs.publish_npm == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-publish.outputs.ref }}

      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.8.x

      - name: Cache Deno deps
        uses: actions/cache@v5
        with:
          path: ~/.cache/deno
          key: ${{ runner.os }}-deno-${{ hashFiles('deno.lock') }}
          restore-keys: |
            ${{ runner.os }}-deno-

      - name: Install locked dependencies
        run: deno task deps:ci

      - name: Build npm package
        run: deno task build:npm
        env:
          RELEASE_VERSION: ${{ needs.resolve-publish.outputs.version }}

      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'

      - name: Detect whether the npm package already exists
        id: package
        run: |
          PACKAGE_NAME=$(node -p "require('./npm/package.json').name")
          if npm view "$PACKAGE_NAME" version > /dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Select npm authentication mode
        id: auth
        env:
          PACKAGE_EXISTS: ${{ steps.package.outputs.exists }}
          REQUESTED_NPM_AUTH: ${{ needs.resolve-publish.outputs.npm_auth }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          AUTH="$REQUESTED_NPM_AUTH"

          if [ "$AUTH" = 'auto' ]; then
            if [ "$PACKAGE_EXISTS" = 'true' ]; then
              AUTH='trusted'
            else
              AUTH='token'
            fi
          fi

          if [ "$AUTH" = 'token' ] && [ -z "$NPM_TOKEN" ]; then
            echo 'NPM token publishing was selected, but the NPM_TOKEN secret is not configured.' >&2
            exit 1
          fi

          echo "mode=$AUTH" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        env:
          AUTH_MODE: ${{ steps.auth.outputs.mode }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "$AUTH_MODE" = 'token' ]; then
            export NODE_AUTH_TOKEN="$NPM_TOKEN"
          fi

          cd npm
          npm publish --provenance --access public
